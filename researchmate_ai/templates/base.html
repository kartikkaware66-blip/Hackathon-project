<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ResearchMate AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-icon">📚</span>
      <span>
        <strong>ResearchMate <em>AI</em></strong>
        <small>Ai Research Assistant</small>
      </span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('library') }}">Library</a>
      <a class="btn btn-primary" href="{{ url_for('home') }}#upload">+ Upload PDF Paper</a>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">ResearchMate AI &nbsp;|&nbsp; AIML</footer>
  <script>const PAPER_ID = {% block paper_id %}null{% endblock %};</script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
